<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>连接 Passport</title><body><h1>正在连接 Passport…</h1>
<p id="message">请保持页面打开，连接后将自动进入。</p><button id="retry" hidden>重新连接</button>
<script>
(async function start() {
  const mode=location.pathname==='/config'?'config':'transfer',path=mode==='config'?'/config':'/transfer';
  const query=new URLSearchParams(location.search);
  let generation=Number(query.get('generation')),lease=Number(query.get('lease'));
  const message=document.getElementById('message'),retry=document.getElementById('retry');
  retry.onclick=()=>location.replace(path);
  const deadline=Date.now()+30000;
  try {
    if(!generation||!lease) {
      const response=await fetch('/api/session/open',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode}),signal:AbortSignal.timeout(8000)});
      if(!response.ok)throw Error(await response.text());
      ({generation,lease}=await response.json());
      if(!Number.isInteger(generation)||!Number.isInteger(lease)||generation<=0||lease<=0)throw Error('连接响应无效');
    }
    while(Date.now()<deadline) {
      try {
        const r=await fetch('/api/session',{cache:'no-store',signal:AbortSignal.timeout(3000)});
        if(r.ok) {
          const state=await r.json();
          if(state.generation!==generation||state.mode!==mode)throw Error('会话已被其他页面切换，请点击重新连接。');
          if(state.ready){location.replace(path+'?generation='+generation+'&lease='+lease);return;}
        }
      }catch(e){if(e.message.includes('会话已被'))throw e;}
      await new Promise(resolve=>setTimeout(resolve,250));
    }
    throw Error('连接超时，请检查网络后重新连接。');
  }catch(e){message.textContent=e.message;retry.hidden=false;}
})();
</script></body></html>
