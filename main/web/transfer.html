<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>文件流转 · Passport</title><link rel="stylesheet" href="/transfer.css"><script defer src="/transfer-protocol.js"></script><script defer src="/transfer.js"></script></head>
<body><div class="shell"><header><a class="wordmark" href="/transfer">PASSPORT <span>LOCAL EXCHANGE</span></a><div class="connection"><i id="lamp"></i><span id="connection">正在连接</span><button id="reconnect" class="quiet" hidden>重新连接</button></div></header>
<main><section class="intro"><p class="eyebrow">同一网络 · 即刻流转</p><h1>让内容，<br>走到另一端<span>↗</span></h1><p class="lead">文字、图片和文件，在你的浏览器之间直接传递。</p><div class="identity"><label for="name">这台设备</label><input id="name" maxlength="16" autocomplete="off" placeholder="为这台设备取个名字"><button id="rename" class="quiet">更新名称</button></div><p class="network-note">发送端保持网页在线，手机尽量保持前台。无互联网也可使用；访客网络或设备隔离可能阻止直连。</p></section>
<section class="workspace"><div class="section-head"><span class="eyebrow">01 / 接收端</span><span id="online">在线 0 台</span></div><div id="peers" class="peers"><p class="empty">等待另一台设备打开此页</p></div><label class="target-label" for="target">发送给</label><select id="target"><option value="all">所有在线设备</option></select>
<div class="section-head divider"><span class="eyebrow">02 / 文字</span><span class="small">直接发送，无需文件</span></div><label class="sr-only" for="text">发送文字</label><textarea id="text" rows="4" placeholder="一句话、一段链接，或刚刚复制的内容…"></textarea><div class="send-row"><span class="small">最多 8,000 字节</span><button id="send-text" class="primary">发送文字 <span>↗</span></button></div><div id="texts" class="texts" aria-live="polite"></div>
<div class="section-head divider"><span class="eyebrow">03 / 文件与图片</span><span class="small">按需接收</span></div><label class="file-drop" for="files"><span class="plus">＋</span><span><strong>选择文件或图片</strong><small>最多共享 8 个文件 · 原文件留在发送端</small></span><input id="files" type="file" multiple></label><p id="save-mode" class="small"></p><div id="catalog" class="catalog"><p class="empty">共享文件会出现在这里</p></div><div class="section-head divider"><span class="eyebrow">传输记录</span><button id="clear" class="quiet">清除已结束记录</button></div><div id="transfers" aria-live="polite"><p class="empty">还没有传输</p></div>
<div id="notice" role="status" class="notice" hidden></div></section></main><footer><span>PASSPORT KEYS / 文件流转</span><span>内容仅在浏览器之间传输 · Passport 不保存</span></footer></div></body></html>
